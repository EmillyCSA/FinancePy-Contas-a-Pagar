<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinancePy</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <header>

        <h1>FinancePy</h1>

        <p>Controle de contas financeiras</p>

    </header>


    <main>

        <section class="dashboard">

            <h2>Dashboard Financeiro</h2>


            <div class="cards">

                <div class="card">
                    <h3>Total</h3>
                    <p>R$ 610,00</p>
                </div>


                <div class="card">
                    <h3>Contas Pagas</h3>
                    <p>1</p>
                </div>


                <div class="card">
                    <h3>Contas Pendentes</h3>
                    <p>1</p>
                </div>

            </div>


            <h2>Ações rápidas</h2>


            <div class="acoes">

                <button>Cadastrar conta</button>

                <button>Listar contas</button>

                <button>Resumo financeiro</button>

            </div>

        </section>

    </main>


</body>

</html>
