```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinancePy</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <h1>FinancePy</h1>

        <p>Controle de contas financeiras</p>

    </header>

    <main>

        <section class="dashboard">

            <h2>Dashboard Financeiro</h2>

            <div class="cards">

                <div class="card">

                    <h3>Valor Total</h3>

                    <p>R$ {{ "%.2f"|format(valor_total)|replace(".", ",") }}</p>

                </div>

                <div class="card">

                    <h3>Contas Pagas</h3>

                    <p>{{ contas_pagas }}</p>

                </div>

                <div class="card">

                    <h3>Contas Pendentes</h3>

                    <p>{{ contas_pendentes }}</p>

                </div>

            </div>

            <h2>Ações rápidas</h2>

            <div class="acoes">

                <a href="/cadastrar">
                    <button>Cadastrar conta</button>
                </a>

                <a href="/listar">
                    <button>Listar contas</button>
                </a>

                <button>Resumo financeiro</button>

            </div>

        </section>

    </main>

</body>

</html>
```
